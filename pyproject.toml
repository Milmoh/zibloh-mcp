[project]
name = "zibloh"
version = "0.1.0"
description = "Zibloh CLI and MCP server: build, deploy and run Zibloh robots from the terminal or Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Milmoh" }]
keywords = ["zibloh", "rpa", "robots", "automation", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "mcp>=2.2,<3",
]

[project.urls]
Homepage = "https://zibloh.com"
Repository = "https://github.com/Milmoh/zibloh-mcp"

[project.scripts]
zibloh = "zibloh.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zibloh"]

# The sdist is the CLI source only: no tests, skills or plugin files.
[tool.hatch.build.targets.sdist]
include = ["src/zibloh", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
