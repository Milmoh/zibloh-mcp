# Monthly and grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: pip
    directories: [/, /src/zibloh/templates/basic]
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      actions: { patterns: ["*"] }
